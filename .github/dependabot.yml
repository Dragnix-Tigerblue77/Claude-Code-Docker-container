# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for more information:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
#
# This repository has two things worth watching, and they are watched
# differently. The workflow's actions are followed by major tags that move on
# their own anyway, so their minor and patch updates are grouped and merged
# without review by .github/workflows/dependabot-auto-merge.yml. The Dockerfile's
# base image is a single FROM line, and the only update Dependabot can ever
# propose for it is a major one, which is exactly the kind that wants a human.
#
# Both entries sit out a cooldown before a release is proposed, and the number
# matters most on the first. Auto-merge fuses a minor or patch update by itself as
# soon as the build is green, and a green build says nothing about whether the new
# release can be trusted, so the delay is what keeps one published this morning, a
# compromised one included, off main before anybody had time to notice and withdraw
# it. Dependabot applies three days to version updates even when no cooldown is
# configured, and its documentation calls that the default behaviour, which is what
# the docker entry relies on. The github-actions entry states the same three days
# instead, because a default is GitHub's to change and the delay in front of an
# auto-merge should be a decision of this file and not something inherited. A
# cooldown holds back version updates only ; security updates ignore it, so a fix
# for a known vulnerability is not delayed.
#
# What is deliberately NOT watched is written at the bottom of this file, so that
# an absence reads as a decision rather than as an oversight.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    # Daily rather than weekly : minor and patch updates are grouped and
    # auto-merged, so checking every day shortens the delay before a fix lands
    # without adding review work. Major updates are opened sooner too, they
    # still wait for a manual review
    schedule:
      interval: "daily"
    # Three days, which is what Dependabot applies when nothing is configured, and
    # stated anyway : this is the delay in front of the auto-merge above, so it is
    # written down here rather than left to a default GitHub can change.
    # "default-days" is the only key this ecosystem takes : the "semver-*-days" ones
    # exist for semver ecosystems such as pip and npm, which are not watched here.
    # Daily stays right with it : the schedule decides how soon a release is noticed
    # once the three days are up
    cooldown:
      default-days: 3
    # Opening a pull request is the only way Dependabot reports anything, and it
    # stops opening them once this many are waiting - silently, naming nothing.
    # The default is 5, and it is reached more easily than it looks : majors come
    # one pull request each and sit there until somebody reviews them, so a few
    # untouched majors are enough to hide every update that follows.
    # 99, not 0 : zero does not mean "no limit", it disables version updates
    # altogether and leaves only security ones. A large value is what the
    # documentation gives as the way to effectively remove the limit
    open-pull-requests-limit: 99
    groups:
      # Minor and patch updates are grouped into a single PR,
      # auto-merged by the dependabot-auto-merge workflow.
      # Major updates stay out of the group: one separate PR each,
      # waiting for manual review (potentially breaking changes).
      github-actions-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # The Dockerfile's "FROM node:<major>-slim", and the reason this file exists at
  # all: it is the one dependency of this repository that reaches users, since the
  # image built from it is what they run.
  - package-ecosystem: "docker"
    directory: "/"
    # Daily, like above. A base image is also how a CVE in the runtime reaches
    # the published image, and a day is the shortest useful interval Dependabot
    # offers for hearing about it
    schedule:
      interval: "daily"
    # No "cooldown" block here, on purpose, and this is the only entry without one.
    # That is not "no delay" : Dependabot's default of three days applies to it all
    # the same, and the key that exempts a dependency outright is "exclude", not the
    # absence of a block. The number is simply not a decision on this entry. It follows
    # the runtime base image, the tag floats, so every update it can raise is a Node
    # major, and a major waits for a human to check it against the base-image rule in
    # CLAUDE.md : nothing merges unattended here for a delay to guard. As for the
    # freshness of the runtime, it does not come through this entry at all : Node's
    # patch releases land on the floating tag, and build-and-publish.yml rebuilds
    # against it every day.
    #
    # The limit is counted per entry, not shared with the one above, so it has to
    # be raised here too for the same reason it was raised there
    open-pull-requests-limit: 99
    # No group here, on purpose, and in practice no auto-merge either : the
    # auto-merge workflow takes every ecosystem's minor and patch updates, and
    # this entry never raises one.
    #
    # The tag is a floating major : Node's own patch releases land on it without
    # the text of the Dockerfile changing, which is why the Dockerfile stays on
    # the tag rather than pinning a digest. The consequence is that every update
    # Dependabot can raise for this line is a MAJOR one. There is no minor or
    # patch stream to group, and nothing to hand to a workflow that merges
    # without review : a new Node major under the CLI that ships to users is a
    # decision, taken about once a year, not a chore.
    #
    # It does not step one major at a time either. Asked to move off 24, it
    # proposed 26 and skipped 25 outright, 25 having reached end of life on
    # 31 March 2026 -- so the version offered here is whatever Node still
    # supports, not the next number up. Which of them may be accepted is the
    # base-image rule in CLAUDE.md, and it is not "the newest one".

# Not watched : npm.
#
# The image does install "@anthropic-ai/claude-code", but no package.json, no
# lockfile, no manifest of any kind in this repository names it or its version.
# The Dockerfile takes the version as a build argument (CLAUDE_CODE_VERSION, with
# no default, and the build fails if it is empty), and
# .github/workflows/build-and-publish.yml resolves it at run time by asking the
# npm registry what the followed dist-tag currently points at.
#
# So there is nothing here for Dependabot to read and nothing for it to bump : an
# "npm" entry would scan the repository, find no manifest, and never open a
# single pull request. The update mechanism for that dependency already exists
# and is the daily workflow run, which rebuilds and republishes only when the
# resolved version, or the digest of the base image, differs from what the
# published image records in its own labels.
#
# Not watched either : devcontainers. This repository has no .devcontainer/
# directory. Add the ecosystem the day it gains one.
