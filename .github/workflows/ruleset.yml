name: Ruleset

# .github/rulesets/main.json is the list of checks Dependabot's updates wait for
# before they merge themselves, and a required check that no job reports blocks
# every pull request with nothing to read. .github/check-ruleset.sh says why and
# how it is read ; this only runs it, on every pull request, which is the one
# place a rename of a job and the file it breaks meet.
#
# No paths filter, for the reason build-and-publish.yml gives : this job is
# itself a required check, and a filtered workflow reports nothing at all rather
# than a skip.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruleset:
    name: Check the ruleset names jobs that exist
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The next step only reads files, so nothing needs the credential the
          # checkout sets up. With this it is removed right after the fetch, and
          # no later step of the job inherits it
          persist-credentials: false

      - name: Check the ruleset against the workflows
        run: .github/check-ruleset.sh
