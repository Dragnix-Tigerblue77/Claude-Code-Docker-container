name: Build and publish

# Three ways in, and only two of them ever touch the registry.
#
# TWO THINGS make the published image stale, and the schedule below exists for
# both. A new Claude Code release is the obvious one. The other is the base: FROM
# names a floating tag, so Debian's and Node's security fixes land on
# node:24-slim without a line of this repository changing, and an image built
# before them keeps shipping what they fixed. Rebuilding only when the npm
# version moves would leave that entirely to the CLI's release cadence -- quiet
# fortnight, fortnight-old base -- which is not a property anybody chose.
#
# So the run compares two things against what is published and rebuilds if
# either moved. It can tell, because the publishing build records the version
# and the base digest on the image as OCI labels ; that is the whole reason they
# are written.
#
# On a pull request the job resolves the version, builds and runs the image, then
# stops: no login, no push. Without that, nothing in this repository would check
# its two real files before they reach the default branch, and the first evidence
# that the Dockerfile builds would arrive on a Monday morning in a scheduled job
# whose failure nobody is watching for.
#
# The pull_request trigger carries NO paths filter, deliberately. A documentation
# change cannot break the image, so filtering looks free -- but this job is a
# REQUIRED status check, and a filtered workflow does not report a skipped check,
# it reports nothing at all. A required check that never reports leaves the pull
# request waiting for it forever, with no error to read. Twenty-five seconds on a
# public repository's unmetered minutes is the price of that not happening, and
# it is not wasted either: the base image is a floating tag, so re-proving that
# today's still builds is worth something on its own.
on:
  schedule:
    # Daily at 05:17 UTC, an odd minute rather than :00 where every cron on
    # GitHub queues at once and scheduled runs get delayed.
    #
    # Issue #1 asked for a weekly run, and weekly was right while the only
    # question was "has the CLI been released again". It is the wrong period for
    # the base: seven days is how long the image would keep shipping a fixed
    # vulnerability in the worst case, for no reason other than the calendar. A
    # run with nothing to do is now two registry reads and no build, so the
    # frequency costs a few seconds of a public repository's unmetered minutes.
    - cron: "17 5 * * *"
  pull_request:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: "npm dist-tag to follow (default: the NPM_DIST_TAG variable, else stable)"
        required: false
        type: string
      moving_tag:
        description: "Docker tag that moves (default: the IMAGE_MOVING_TAG variable, else latest)"
        required: false
        type: string
      force:
        description: "Rebuild and republish even when nothing moved"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

# Publishing runs never cancel each other: a cancelled push can leave a tag
# pointing at a partially uploaded manifest. Pull request runs are throwaway, so
# a newer push supersedes an older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish:
    name: Build, verify, and publish when a new version appears
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Resolve the image name and the version to build
        id: resolve
        env:
          # TWO NAMES, and they are deliberately not the same one.
          #
          # DIST_TAG is the npm channel this image is BUILT FROM. "stable" lags
          # "latest" by a few releases -- 27 of them the day this was written --
          # and has therefore survived contact with other people, which is what
          # an image somebody runs daily wants underneath it.
          #
          # MOVING_TAG is the Docker tag this image is PUBLISHED UNDER. It is
          # "latest" because that is the tag "docker pull <image>" resolves to
          # when no tag is given, and an image nobody can pull without reading
          # the README first is an image that does not get pulled.
          #
          # They used to be one value, which made the tag name double as the
          # record of which channel the image came from. That record now lives
          # in a label instead, since the tag no longer carries it.
          DIST_TAG: ${{ inputs.dist_tag || vars.NPM_DIST_TAG || 'stable' }}
          MOVING_TAG: ${{ inputs.moving_tag || vars.IMAGE_MOVING_TAG || 'latest' }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # A registry reference must be lowercase. This organisation's name
          # carries capitals, so ${{ github.repository }} cannot be used as-is:
          # docker rejects it at push time, after a successful build.
          image="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"

          version="$(npm view "@anthropic-ai/claude-code@${DIST_TAG}" version)"
          if [ -z "$version" ]; then
            echo "::error::npm returned no version for dist-tag '${DIST_TAG}'" >&2
            exit 1
          fi

          {
            echo "image=${image}"
            echo "version=${version}"
            echo "dist_tag=${DIST_TAG}"
            echo "moving_tag=${MOVING_TAG}"
          } >> "$GITHUB_OUTPUT"

          echo "Following npm dist-tag '${DIST_TAG}', which resolves to ${version}."
          echo "Publishing it under the moving Docker tag '${MOVING_TAG}'."

      # Both of these now run before the decision instead of after it: the
      # decision is taken on the base digest, so it has to be resolved first,
      # and resolving it needs the Dockerfile
      - name: Checkout
        uses: actions/checkout@v7

      # The digest has to be resolved BEFORE the build, because a label is baked
      # into the image config at build time and cannot be added afterwards
      # without building again.
      #
      # Read from the registry's manifest rather than by pulling. "docker pull"
      # would answer the same question and close the window below by leaving the
      # image local for the build to reuse, at the cost of downloading eighty
      # megabytes on every run including the ones with nothing to do -- against
      # Docker Hub, whose anonymous limit is counted per IP and shared across
      # GitHub's runners. Reading the manifest transfers a few kilobytes.
      #
      # What that leaves open is a few seconds between this read and the build's
      # own pull, in which the floating tag could move and leave the label one
      # digest behind the bytes. That is accepted rather than closed, because
      # what it costs is bounded and self-repairing: the next scheduled run
      # compares the recorded digest against the current one, finds them
      # different, and rebuilds once. A base that moves inside a five-second
      # window buys one unnecessary rebuild, not a wrong answer that persists.
      #
      # Closing it properly would mean pulling the base here -- eighty megabytes
      # on every run -- or building against the digest instead of the tag, which
      # means an ARG the Dockerfile's FROM line resolves and puts Dependabot's
      # watch on that line at risk. Neither is worth removing a fault that
      # repairs itself the following day.
      - name: Pull the base image and record the digest it resolves to
        id: base
        run: |
          set -euo pipefail

          # Read from the Dockerfile rather than repeating "node:24-slim" here.
          # Dependabot edits that FROM line and knows nothing of this file, so a
          # copy kept here would start describing the previous base the moment
          # one of its pull requests is merged -- silently, a wrong label being
          # indistinguishable from a right one until something reads it back.
          name="$(sed -n 's/^[[:space:]]*FROM[[:space:]]\{1,\}\([^[:space:]]\{1,\}\).*/\1/p' Dockerfile | head -n 1)"
          if [ -z "$name" ]; then
            echo "::error::could not read the base image from the Dockerfile's FROM line" >&2
            exit 1
          fi

          # Retried, because this call reaches Docker Hub and Docker Hub is not
          # reliable from a shared runner. It has already failed once here with
          # "read: connection reset by peer" on the CDN, on a commit whose only
          # sin was to run eight seconds after an identical one that passed, and
          # a spent anonymous pull quota answers 429 the same way. Without the
          # ladder, a reset is a red pull request to re-run by hand and a
          # scheduled refresh silently skipped for the day
          errors="$RUNNER_TEMP/base-inspect-error.txt"
          digest=""
          for delay in 5 15 45 0; do
            if manifest="$(docker buildx imagetools inspect "$name" --format '{{json .Manifest}}' 2>"$errors")"; then
              digest="$(printf '%s' "$manifest" | jq -r '.digest // empty')"
              [ -n "$digest" ] && break
            fi
            if [ "$delay" -gt 0 ]; then
              echo "::warning::could not resolve ${name}, retrying in ${delay}s"
              sed 's/^/  /' "$errors" >&2 || true
              sleep "$delay"
            fi
          done

          if [ -z "$digest" ]; then
            echo "::error::could not resolve the digest of ${name}" >&2
            cat "$errors" >&2 || true
            exit 1
          fi

          {
            echo "name=${name}"
            echo "digest=${digest}"
          } >> "$GITHUB_OUTPUT"

          echo "Base image ${name} currently resolves to ${digest}."

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          printf '%s' '${{ secrets.GITHUB_TOKEN }}' \
            | docker login ghcr.io --username '${{ github.actor }}' --password-stdin

      # The one place a wrong answer is expensive in both directions. Saying
      # "nothing to do" when the base moved leaves a fixed vulnerability
      # published ; saying "rebuild" when nothing moved republishes an identical
      # image every night and makes the tag history useless for telling when
      # something actually changed.
      #
      # Everything it needs is on the published image itself, read back from the
      # moving tag: which version is on it, and which base digest it was built
      # on. No state is kept anywhere else, so there is nothing to fall out of
      # sync with reality.
      - name: Decide whether there is anything to build
        id: decide
        env:
          IMAGE: ${{ steps.resolve.outputs.image }}
          VERSION: ${{ steps.resolve.outputs.version }}
          DIST_TAG: ${{ steps.resolve.outputs.dist_tag }}
          MOVING_TAG: ${{ steps.resolve.outputs.moving_tag }}
          BASE_DIGEST: ${{ steps.base.outputs.digest }}
          FORCE: ${{ inputs.force }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail

          decided() {
            {
              echo "build=$1"
              echo "push_version=$2"
              echo "reason=$3"
            } >> "$GITHUB_OUTPUT"
            echo "$3"
            exit 0
          }

          # On a pull request the point IS to build, and querying the registry
          # would need a login this run deliberately does not perform
          if [ "${EVENT}" = "pull_request" ]; then
            decided true false "Pull request: building to validate, without publishing."
          fi

          if [ "${FORCE}" = "true" ]; then
            decided true true "Forced rebuild requested."
          fi

          # Read the moving tag's config once and take both labels off it. The
          # version tag is not the reference here: it is immutable by design, so
          # it cannot say whether the CHANNEL is up to date, which is the
          # question a refresh has to answer
          errors="$RUNNER_TEMP/imagetools-error.txt"
          if config="$(docker buildx imagetools inspect "${IMAGE}:${MOVING_TAG}" --format '{{json .Image}}' 2>"$errors")"; then
            label() {
              printf '%s' "$config" \
                | jq -r "if has(\"config\") then [.] else [.[]] end
                         | map(.config.Labels[\"$1\"] // empty)
                         | first // \"\""
            }
            published_version="$(label org.opencontainers.image.version)"
            published_base="$(label org.opencontainers.image.base.digest)"
          elif grep -qiE 'not found|manifest unknown|name unknown' "$errors"; then
            # Nothing published under that tag yet, so there is nothing to
            # compare against and everything to build
            published_version=""
            published_base=""
          else
            # Credentials, rate limit, registry outage: none of these is an
            # answer to "did anything move ?", and guessing here is what would
            # turn this job into an unconditional nightly republication, green
            # run after green run, with nobody noticing
            echo "::error::Could not read ${IMAGE}:${MOVING_TAG}, giving up rather than assuming something moved" >&2
            cat "$errors" >&2
            exit 1
          fi

          if [ -z "$published_version" ]; then
            # Either the tag does not exist, or it predates the labels. Both are
            # answered by building once ; expected exactly once for the second,
            # and twice in a row means the publishing step is not recording them
            decided true true "Nothing readable is published under ${MOVING_TAG} yet. Building."
          fi

          if [ "$published_version" != "$VERSION" ]; then
            decided true true "Published ${MOVING_TAG} is on ${published_version}, npm ${DIST_TAG} resolves to ${VERSION}. Building."
          fi

          if [ "$published_base" != "$BASE_DIGEST" ]; then
            # The version tag is deliberately NOT republished here. It names an
            # exact set of bytes somebody may have pinned, and moving it would
            # take away the one thing a version tag is for -- rolling back to a
            # known state. Only the moving tag moves, which is what it is for
            decided true false "Same version ${VERSION}, but the base moved from ${published_base:-nothing recorded} to ${BASE_DIGEST}. Rebuilding ${MOVING_TAG} only."
          fi

          decided false false "${IMAGE}:${MOVING_TAG} is on ${VERSION} and on the current base. Nothing to do."

      # The labels are the OCI pre-defined annotation keys, and they are not
      # decoration. Three of them do work nothing else does:
      #
      # "source" is what makes ghcr.io attach the package to this repository --
      # the package page inherits the README, the licence and the visibility
      # conversation instead of standing alone as an anonymous blob;
      #
      # "base.digest" and "base.name" record which bytes this image was built
      # on. The base is a FLOATING tag, so the only way to answer "is what is
      # published still built on the current node:24-slim ?" is to have written
      # the answer down at build time. Nothing reads it back yet -- the workflow
      # that does is issue #1's, and it cannot be written until this exists;
      #
      # "version" says which Claude Code is inside, readable with docker
      # inspect and without pulling the whole image.
      - name: Build
        if: steps.decide.outputs.build == 'true'
        env:
          IMAGE: ${{ steps.resolve.outputs.image }}
          VERSION: ${{ steps.resolve.outputs.version }}
          DIST_TAG: ${{ steps.resolve.outputs.dist_tag }}
          MOVING_TAG: ${{ steps.resolve.outputs.moving_tag }}
          BASE_NAME: ${{ steps.base.outputs.name }}
          BASE_DIGEST: ${{ steps.base.outputs.digest }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          docker build \
            --build-arg "CLAUDE_CODE_VERSION=${VERSION}" \
            --label "org.opencontainers.image.title=Claude Code Docker container" \
            --label "org.opencontainers.image.description=Claude Code, unmodified, packaged as a container image" \
            --label "org.opencontainers.image.source=${SOURCE}" \
            --label "org.opencontainers.image.url=${SOURCE}" \
            --label "org.opencontainers.image.documentation=${SOURCE}#readme" \
            --label "org.opencontainers.image.licenses=AGPL-3.0-only" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.revision=${REVISION}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "org.opencontainers.image.base.name=${BASE_NAME}" \
            --label "org.opencontainers.image.base.digest=${BASE_DIGEST}" \
            --label "io.github.dragnix-tigerblue77.claude-code.npm-dist-tag=${DIST_TAG}" \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:${MOVING_TAG}" \
            .

      # An image that builds is not an image that runs. This catches a base image
      # that changed under us, a missing runtime dependency, or an npm package
      # that installed without its entry point being executable.
      - name: Verify the built image actually runs
        if: steps.decide.outputs.build == 'true'
        env:
          IMAGE: ${{ steps.resolve.outputs.image }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          reported="$(docker run --rm "${IMAGE}:${VERSION}" --version)"
          echo "Container reports: ${reported}"
          printf '%s' "$reported" | grep -qF "${VERSION}" || {
            echo "::error::the image does not report the version it was built with" >&2
            exit 1
          }

      # A label that failed to be written is indistinguishable from one that was
      # never asked for, and the workflow issue #1 needs will read two of these
      # back to decide whether to rebuild. Checking them here means a typo in a
      # --label flag fails the pull request that introduced it, rather than
      # turning into a refresh job that finds nothing recorded and rebuilds
      # every night for ever.
      #
      # What it does NOT check is the base the build really used, and that is
      # not an oversight -- it was tried and does not work. BuildKit keeps base
      # images in its own cache and never puts them in the image store, so
      # "docker image inspect node:24-slim" answers "No such image" after a
      # perfectly good build. Nothing short of pulling the base separately, or
      # reading the provenance attestation off an image that has already been
      # pushed, can answer it, and neither is worth its price here : see the
      # resolution step for what the remaining window is and why it heals
      - name: Verify the labels the image is supposed to carry
        if: steps.decide.outputs.build == 'true'
        env:
          IMAGE: ${{ steps.resolve.outputs.image }}
          VERSION: ${{ steps.resolve.outputs.version }}
          BASE_DIGEST: ${{ steps.base.outputs.digest }}
        run: |
          set -euo pipefail

          label() {
            docker image inspect "${IMAGE}:${VERSION}" \
              --format "{{index .Config.Labels \"$1\"}}"
          }

          failed=false
          for key in \
            org.opencontainers.image.source \
            org.opencontainers.image.licenses \
            org.opencontainers.image.version \
            org.opencontainers.image.revision \
            org.opencontainers.image.base.name \
            org.opencontainers.image.base.digest \
            io.github.dragnix-tigerblue77.claude-code.npm-dist-tag
          do
            value="$(label "$key")"
            if [ -z "$value" ] || [ "$value" = "<no value>" ]; then
              echo "::error::${key} is missing from the built image" >&2
              failed=true
            else
              echo "${key} = ${value}"
            fi
          done

          # Not just "is it set" for this one : it is the value a refresh
          # decision gets taken on, so it is checked against what the resolution
          # step actually read rather than merely being non-empty. That catches
          # the plausible failure -- a --label wired to the wrong variable, or to
          # a variable that expanded to nothing
          recorded="$(label org.opencontainers.image.base.digest)"
          if [ "$recorded" != "$BASE_DIGEST" ]; then
            echo "::error::the image records base digest ${recorded}, this run resolved ${BASE_DIGEST}" >&2
            failed=true
          fi

          [ "$failed" = false ]

      - name: Push
        if: steps.decide.outputs.build == 'true' && github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.resolve.outputs.image }}
          VERSION: ${{ steps.resolve.outputs.version }}
          MOVING_TAG: ${{ steps.resolve.outputs.moving_tag }}
          PUSH_VERSION: ${{ steps.decide.outputs.push_version }}
        run: |
          set -euo pipefail
          # The moving tag always moves. The version tag is pushed only when it
          # is a version that has not been published before: a rebuild caused by
          # the base moving produces different bytes under the same version
          # number, and overwriting the tag would silently replace what somebody
          # pinned. Whoever wants the fixed base asks for the channel
          if [ "${PUSH_VERSION}" = "true" ]; then
            docker push "${IMAGE}:${VERSION}"
          else
            echo "Leaving ${IMAGE}:${VERSION} on the bytes it was published with."
          fi
          docker push "${IMAGE}:${MOVING_TAG}"

      - name: Summary
        if: always()
        env:
          IMAGE: ${{ steps.resolve.outputs.image }}
          VERSION: ${{ steps.resolve.outputs.version }}
          DIST_TAG: ${{ steps.resolve.outputs.dist_tag }}
          MOVING_TAG: ${{ steps.resolve.outputs.moving_tag }}
          BASE_NAME: ${{ steps.base.outputs.name }}
          BASE_DIGEST: ${{ steps.base.outputs.digest }}
          BUILT: ${{ steps.decide.outputs.build }}
          PUSH_VERSION: ${{ steps.decide.outputs.push_version }}
          REASON: ${{ steps.decide.outputs.reason }}
          EVENT: ${{ github.event_name }}
        run: |
          {
            echo "### Claude Code image"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| npm dist-tag followed | \`${DIST_TAG:-unresolved}\` |"
            echo "| moving Docker tag | \`${MOVING_TAG:-unresolved}\` |"
            echo "| version resolved | \`${VERSION:-unresolved}\` |"
            echo "| base image | \`${BASE_NAME:-unresolved}\` |"
            echo "| base digest | \`${BASE_DIGEST:-unresolved}\` |"
            if [ "${EVENT}" = "pull_request" ]; then
              echo "| result | built and ran, not published (pull request) |"
            elif [ "${BUILT}" = "true" ] && [ "${PUSH_VERSION}" = "true" ]; then
              echo "| result | published \`${IMAGE}:${VERSION}\` and \`${IMAGE}:${MOVING_TAG}\` |"
            elif [ "${BUILT}" = "true" ]; then
              echo "| result | republished \`${IMAGE}:${MOVING_TAG}\` on the current base, leaving \`${IMAGE}:${VERSION}\` untouched |"
            else
              echo "| result | nothing to do |"
            fi
            echo
            echo "${REASON:-The run did not get as far as deciding.}"
          } >> "$GITHUB_STEP_SUMMARY"
