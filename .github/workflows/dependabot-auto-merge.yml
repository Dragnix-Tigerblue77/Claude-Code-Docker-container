name: Dependabot auto-merge

# Dependabot's minor and patch updates, every ecosystem, merge themselves once
# the checks .github/rulesets/main.json requires are green on them. Majors stay
# open for a review. The same shape as wader/postfix-relay's workflow of the
# same name, which every repository of this owner is aligned on.
#
# "gh pr merge --auto" asks GitHub to merge LATER, once the required checks
# pass, and it is GitHub that does the waiting. Two repository settings make
# that true, and neither is a file: "Allow auto-merge" (Settings > General),
# and a ruleset on main that requires checks. .github/rulesets/main.json is that
# ruleset, in the form "Import a ruleset" takes, and .github/check-ruleset.sh
# fails a pull request whose ruleset names a check no job reports.
#
# There is deliberately no fallback. The one this file used to carry,
# "|| gh pr merge --squash", merged at once whenever "--auto" could not be
# enabled -- which is exactly when nothing on main requires a check, so it
# landed the update with no check having run. A pull request that cannot be
# queued now stays open, which is visible, instead of merged, which is not.
#
# No filter on the ecosystem either. The docker entry of .github/dependabot.yml
# can only ever raise majors, as its comment explains, so this never merges one
# of those; and for anything else it is the build, not a guess about which
# ecosystem is risky, that decides whether an update is safe.
#
# The merge is a squash, as every pull request on main is.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Queue minor and patch Dependabot updates for auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
