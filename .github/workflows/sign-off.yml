name: Sign-off

# CONTRIBUTING.md requires a Signed-off-by line on every commit and nothing
# looked for one until this job. Of the five commits on main when it was
# written, one carried it.
#
# On pull requests only, deliberately : a squash merge composes its message from
# the pull request rather than from the branch, so the branch's own commits are
# the last place the trailer still exists to be read. Running this on a push to
# main would also leave the default branch permanently red over four commits
# that cannot be signed without rewriting published history.
#
# The reasoning behind every decision the check makes lives in the script, next
# to the code that makes it.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign-off:
    name: Check the commits carry a sign-off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # fetch-depth 0 because the script reads base..head, and a shallow
      # checkout has neither end of that range
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The two SHAs travel as environment variables rather than being
      # interpolated into the command line. They are hexadecimal and GitHub's
      # own, so nothing here is waiting to be escaped, but a run: block that
      # expands ${{ }} inline is the shape that goes wrong the day the value
      # stops being a SHA, and there is no reason for this one to have it
      - name: Check the sign-offs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/check-sign-off.sh "$BASE_SHA" "$HEAD_SHA"
